# ------------------------------------------------------------
# Validation rules
# ------------------------------------------------------------

[validation]
require_known_sections_only = true
require_known_fields_only = true
require_single_repo_class = true
require_repo_name_to_match_declared_class = true
require_declared_class_to_exist_in_class_registry = true
require_dependencies_to_follow_dependency_law = true
require_manifest_filename_allowed = true

[validation.defaults]
empty_optional_lists_allowed = true
empty_required_lists_allowed = true

# ------------------------------------------------------------
# Contract validation rules
# ------------------------------------------------------------

[validation.contract]

# --- Presence: the contract section must be complete for the contract class ---
# WHY: the role-based rules below are only enforceable if these fields exist.
contract_role_required_for_contract_class = true
contract_authority_required_for_contract_class = true
contract_version_required_for_contract_class = true

# --- Role validity ---
# WHY: contract_role is the discriminator the resolver keys on; it must be a
# known role, exactly one.
contract_role_must_be_known = true

# --- Self-authority: every contract repo authors its own contract ---
# WHY: contract_authority denotes the authority for THIS repo's own contract,
# which is always this repo. This is the positive constraint that makes the
# graph acyclic at the authority level: no repo can name another as the
# authority for its own contract.
contract_authority_must_equal_self = true

# --- Authority role: defines a root contract, consumes nothing ---
# WHY: an authority is the top of a contract chain. If it consumed a contract,
# it would not be an authority.
authority_role_must_not_consume_contract = true

# --- Domain-contract role: defines its own contract, consumes exactly one upstream ---
# WHY: a domain-contract composes an upstream contract, so it must declare what
# it consumes for the resolver to resolve.
domain_contract_role_must_consume_contract = true

# WHY: a domain-contract must not consume itself — that would be a bootstrap loop
# (resolving its own vocabulary from itself).
domain_contract_must_not_consume_self = true

# NOTE (intentionally not a rule): a domain contract is its own authority
# (contract_authority_must_equal_self) and cannot consume itself
# (domain_contract_must_not_consume_self). Together these entail that a domain
# contract never consumes its own authority, so no consume-own-authority rule is
# added — it would be a derived restatement that could drift from its premises.

# ------------------------------------------------------------
# Notes
# ------------------------------------------------------------

[notes]
manifest_role = "Declares repository intent, scope, role, and compatibility under constitutional law."
non_goals = [
    "build configuration",
    "deployment configuration",
    "runtime secrets",
    "replace README documentation",
    "replace CITATION.cff",
    "duplicate constitutional law tables",
]
