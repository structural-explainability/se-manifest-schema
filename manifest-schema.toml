# ============================================================
# manifest-schema.toml
# ============================================================
# Canonical structural-explainability manifest schema definition.
# Defines required sections, fields, and validation rules for
# SE_MANIFEST.toml files in the Structural Explainability ecosystem.
#
# Navigation:
#   [meta]                    schema identity
#   [manifest]                manifest file contract
#   [manifest.identity]       required manifest identity fields
#
#   SECTION REGISTRY          allowed sections and fields
#   FIELD DEFINITIONS         types, required status, and constraints
#   DEPENDENCY DECLARATIONS   dependency item shape and allowed kinds
#   PROVIDES DECLARATIONS     provided artifacts and formalization metadata
#   CLASS REGISTRY            which sections each repo class requires
#   VALIDATION RULES          enforcement policy
#   NOTES                     non-goals and manifest role
# ============================================================

[meta]
manifest_schema_id = "se-manifest-schema-1"
purpose = "Defines required sections, fields, and validation rules for SE_MANIFEST.toml in the Structural Explainability ecosystem."
schema = "se-manifest-schema"
status = "active"
title = "Structural Explainability Manifest Schema"
version = "0.5.0"

[manifest]
allowed_filenames = ["SE_MANIFEST.toml", "MANIFEST.toml"]
filename = "SE_MANIFEST.toml"
human_legible = true
machine_readable = true
reviewable = true

[manifest.identity]
schema_allowed = ["se-manifest-schema"]
schema_field = "schema"
schema_required = true
schema_version_field = "schema_version"
schema_version_required = true
schema_url_field = "schema_url"
schema_url_required = true

# ------------------------------------------------------------
# Section registry
# ------------------------------------------------------------

[section.meta]
allowed_fields = [
  "framework",
  "framework_url",
  "framework_note",
  "description",
  "purpose",
]
description = "Non-normative contextual information about the manifest and framework."
required = true

[section.repository]
allowed_fields = ["name", "organization", "class", "kind", "status", "since", "summary"]
description = "Stable repository identity and declared class."
required = true

[section.layer]
allowed_fields = ["space", "role"]
description = "Declared epistemic position."
required = true

[section.depends]
allowed_fields = ["required", "optional"]
description = "Declared upstream dependencies."
required = true

[section.provides]
allowed_fields = ["artifacts", "formalization"]
description = "Artifacts intentionally provided and maintained."
required = true

[section.contract]
allowed_fields = [
  "contract_version",
  "contract_role",
  "contract_authority",
  "exports_verified_contract",
  "consumes_contract_from",
]
description = "Formal contract metadata for repositories that define, implement, verify, or consume a contract."
required = false

[section.exports]
allowed_fields = [
  "invariants",
  "manifest_schema",
  "role_capability_map",
  "regimes",
  "relations",
  "proofs",
  "theorems",
]
description = "Machine-readable artifact paths exported by the repository."
required = false

[section.scope]
allowed_fields = ["includes", "excludes"]
description = "Explicit semantic boundary."
required = true

[section.validation]
allowed_fields = [
  "entrypoint",
  "export_check_entrypoint",
  "graph_entrypoint",
  "reference_entrypoint",
  "strict_entrypoint",
  "tag_entrypoint",
]
description = "Repository-local validation configuration."
required = false

[section.naming]
allowed_fields = ["pattern"]
description = "Repository naming conventions."
required = false

[section.governance]
allowed_fields = ["authority", "authority_manifest"]
description = "Governance and authority declaration pointers."
required = false

[section.compatibility]
allowed_fields = [
  "constitution",
  "kernel",
  "mapspec",
  "schema",
  "profile",
  "rules",
]
description = "Declared compatibility with constitutional and ecosystem components."
required = false

[section.citation]
allowed_fields = ["cff", "preferred", "bib_hint"]
description = "Citation pointer metadata."
required = true

[section.traceability]
allowed_fields = ["identifier_map"]
description = "Identifier resolution and traceability strategy."
required = true

# ------------------------------------------------------------
# Field definitions
# ------------------------------------------------------------

[field.repository.name]
constraints = ["nonempty", "ascii-repo-name", "matches-constitution-naming-law"]
required = true
type = "string"

[field.repository.organization]
constraints = ["nonempty"]
required = true
type = "string"

[field.repository.class]
constraints = ["known-repo-class"]
required = true
type = "string"

[field.repository.kind]
constraints = ["nonempty"]
required = true
type = "string"

[field.repository.status]
constraints = ["known-status"]
required = true
type = "string"

[field.repository.since]
constraints = ["year-or-date-string"]
required = true
type = "string"

[field.repository.summary]
constraints = ["nonempty"]
required = true
type = "string"

[field.layer.space]
constraints = ["nonempty"]
required = true
type = "string"

[field.layer.role]
constraints = ["nonempty"]
required = true
type = "string"

# --- depends ---
# Each dependency item is a structured dependency declaration.
# String dependencies are not allowed.

[field.depends.required]
required = true
type = "list[dependency]"

[field.depends.optional]
required = true
type = "list[dependency]"

# ------------------------------------------------------------
# Custom structured field types
# ------------------------------------------------------------
# These named types may be used inside field `type` declarations, including
# list forms such as `list[dependency]`.
# ------------------------------------------------------------

[custom_types]
allowed = ["dependency", "formalization"]

[custom_type.dependency]
description = "Structured repository dependency declaration."
fields = "dependency_fields"
kind = "record"

[custom_type.formalization]
description = "Structured formalization artifact declaration."
fields = "provides_formalization_fields"
kind = "record"

[dependency_fields]
allowed_fields = ["repository", "kind", "version", "reason"]

[field.dependency.repository]
constraints = ["nonempty", "ascii-repository-ref"]
required = true
type = "string"

[field.dependency.kind]
constraints = ["known-dependency-kind"]
required = true
type = "string"

[field.dependency.version]
constraints = ["nonempty"]
required = false
type = "string"

[field.dependency.reason]
constraints = ["nonempty"]
required = false
type = "string"

[dependency_kinds]
allowed = [
  "semantic",
  "tooling",
  "documentation",
  "test",
  "release",
  "provenance",
]

# --- field provides artifacts ---

[field.provides.artifacts]
required = true
type = "list[string]"

# --- field provides formalization ---

[field.provides.formalization]
description = "Named formalization artifacts provided by this repository."
required = false
type = "map[formalization]"

[provides_formalization_fields]
allowed_fields = [
    "kind",
    "status",
    "symbols",
    "path",
    "reason",
]

[field.provides.formalization.kind]
constraints = ["known-formalization-kind"]
required = true
type = "string"

[field.provides.formalization.status]
constraints = ["known-formalization-status"]
required = true
type = "string"

[field.provides.formalization.symbols]
required = true
type = "list[string]"

[field.provides.formalization.path]
constraints = ["relative-path"]
required = false
type = "string"

[field.provides.formalization.reason]
constraints = ["nonempty"]
required = false
type = "string"

[formalization_kinds]
allowed = [
  "lean-theorem-set",
  "lean-surface",
  "classification-matrix",
  "proof-artifact",
]

[formalization_statuses]
allowed = ["canonical", "auxiliary", "transitional", "superseded"]

# --- exports ---

[field.exports.invariants]
constraints = ["relative-path", "json-file"]
required = false
type = "string"

[field.exports.manifest_schema]
constraints = ["relative-path", "toml-file"]
required = false
type = "string"

[field.exports.role_capability_map]
constraints = ["relative-path", "toml-file"]
required = false
type = "string"

[field.exports.regimes]
constraints = ["relative-path", "json-file"]
required = false
type = "string"

[field.exports.relations]
constraints = ["relative-path", "json-file"]
required = false
type = "string"

[field.exports.proofs]
constraints = ["relative-path", "json-file"]
required = false
type = "string"

[field.exports.theorems]
constraints = ["relative-path", "json-file"]
required = false
type = "string"

# --- contract ---

[field.contract.contract_version]
constraints = ["nonempty"]
required = false
type = "string"

[field.contract.contract_role]
constraints = ["known-contract-role"]
required = false
type = "string"

[field.contract.contract_authority]
constraints = ["nonempty"]
required = false
type = "string"

[field.contract.exports_verified_contract]
required = false
type = "boolean"

[field.contract.consumes_contract_from]
constraints = ["nonempty"]
required = false
type = "string"

[contract_roles]
allowed = ["authority", "domain-contract"]

# --- schema ---

[field.schema_version]
constraints = ["semver"]
required = true
type = "string"

# --- scope ---

[field.scope.includes]
required = true
type = "list[string]"

[field.scope.excludes]
required = true
type = "list[string]"

# --- validation ---
# These fields define the repository-local [validation] manifest section.
# Do not put actual validation entrypoint values in manifest-schema.toml;
# individual SE_MANIFEST.toml files declare them.

[field.validation.entrypoint]
required = false
type = "string"

[field.validation.export_check_entrypoint]
required = false
type = "string"

[field.validation.graph_entrypoint]
required = false
type = "string"

[field.validation.reference_entrypoint]
required = false
type = "string"

[field.validation.strict_entrypoint]
required = false
type = "string"

[field.validation.tag_entrypoint]
required = false
type = "string"

# --- naming and governance ---

[field.naming.pattern]
required = false
type = "string"

[field.governance.authority]
required = false
type = "string"

[field.governance.authority_manifest]
constraints = ["relative-path", "toml-file"]
required = false
type = "string"

# --- meta ---

[field.meta.framework]
required = false
type = "string"

[field.meta.framework_url]
required = false
type = "string"

[field.meta.framework_note]
required = false
type = "string"

[field.meta.description]
required = false
type = "string"

[field.meta.purpose]
required = false
type = "string"

# --- compatibility ---

[field.compatibility.constitution]
required = false
type = "string"

[field.compatibility.kernel]
required = false
type = "string"

[field.compatibility.mapspec]
required = false
type = "string"

[field.compatibility.schema]
required = false
type = "list[string]"

[field.compatibility.profile]
required = false
type = "list[string]"

[field.compatibility.rules]
required = false
type = "list[string]"

# --- citation and traceability ---

[field.citation.cff]
required = true
type = "string"

[field.citation.preferred]
required = true
type = "string"

[field.citation.bib_hint]
required = false
type = "string"

[field.traceability.identifier_map]
required = true
type = "string"

[class_fields]
allowed_fields = [
  "required_repo_name_patterns",
  "required_layer_roles",
  "required_sections",
  "optional_sections",
  "forbidden_sections",
  "required_compatibility_fields",
]
# ------------------------------------------------------------
# CLASS REGISTRY (index) - all repo classes, alphabetical
#
# Class:
#   The type of SE ecosystem responsibility this repository has
#
# Kind:
#   The subtype of that class this repository belongs to
#
# Role:
#   The role this repository plays in the SE dependency graph
#
# Repo class is the partition key.
# Repo kind and layer role refine the class.
# ------------------------------------------------------------
#   adapter
#   admin
#   application
#   authority_surface_specification
#   constitution
#   contract
#   data_companion
#   docs
#   engine
#   formal_contract
#   govsrc
#   implementation
#   kernel
#   manifest_schema
#   mapping
#   mapspec
#   paper
#   pilot
#   policy
#   profile
#   record_system
#   regimes
#   rules
#   schema
#   specification
#   theory
#   tool
#   verification
#   verifier
#   vocabulary
# ------------------------------------------------------------

