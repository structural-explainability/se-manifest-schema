# ============================================================
# .github/workflows/release-pypi.yml (ALL-PY-SRC-PYPI-REPOS)
# ============================================================
# Updated: 2026-10-08
#
# WHY: Publish validated, tagged Python distributions to PyPI.
# REQ: Trigger ONLY on version tags like v1.2.3.
# REQ: PyPI project must be configured for Trusted Publishing (OIDC).
# REQ: pre-release.yml must build, validate, and upload the dist artifact.
#
# OBS: Two jobs, deliberately separated:
#      1) pre-release - validates and builds distributions once.
#      2) publish     - downloads those exact distributions, creates
#                       the GitHub Release, and publishes to PyPI.
# OBS: Documentation deployment is handled by deploy-zensical.yml.
# OBS: No rebuild or duplicate schema validation during publishing.

name: Release (PyPI)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read # WHY: Use read-only permissions by default.

env:
  PYTHONUNBUFFERED: "1"     # WHY: Real-time logging.
  PYTHONIOENCODING: "utf-8" # WHY: Consistent UTF-8 encoding.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  # WHY: Serialize releases per tag and never cancel an active release.

jobs:
  # ============================================================
  # A) PRE-RELEASE: Validate and build distributions
  # ============================================================

  pre-release:
    uses: $/.github/workflows/pre-release.yml

  # ============================================================
  # B) PUBLISH: Release the exact validated distributions
  # ============================================================

  publish:
    needs: pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi

    permissions:
      contents: write # WHY: Create the GitHub Release.
      id-token: write # WHY: PyPI Trusted Publishing (OIDC).

    steps:
      - name: B1) Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        # WHY: Provides repository context for GitHub Release.
        # OBS: No full history required; distributions are not rebuilt.

      - name: B2) Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
        # WHY: Use the exact distributions produced by pre-release.yml.

      - name: B3) Verify downloaded artifact versions match tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]

          assert tag.startswith("v"), "Expected version tag"
          version = tag[1:]

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))

          assert len(wheels) == 1, "Expected exactly one wheel"
          assert len(sdists) == 1, "Expected exactly one sdist"

          wheel_version = wheels[0].name.split("-")[1]
          sdist_version = (
              sdists[0].name.removesuffix(".tar.gz").rsplit("-", 1)[1]
          )

          assert wheel_version == version, "Wheel version mismatch"
          assert sdist_version == version, "Sdist version mismatch"

          print(f"Verified release version: {version}")
          print(f"Wheel: {wheels[0].name}")
          print(f"Sdist: {sdists[0].name}")
          PY
        # WHY: Confirm both downloaded distributions match the release tag.
        # OBS: No rebuild or modification of the distributions.

      - name: B4) Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        # WHY: Publish the validated distributions as GitHub Release assets.

      - name: B5) Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # WHY: Publish validated distributions using PyPI OIDC.
        # OBS: Uploads dist/* without rebuilding.
