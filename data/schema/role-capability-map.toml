# ============================================================
# role-capability-map.toml
# ============================================================
# Canonical role/capability map for Structural Explainability.
#
# Purpose:
#   Binds manifest repo classes to role groups, role groups to verifier
#   capability profiles, and role groups to graph-permission rules.
#
# Consumers:
#   - se-manifest graph verifier:
#       reads [role_groups] and [graph_permissions]
#   - accountable-record verifier:
#       reads [role_groups] and [capability_profiles]
#   - future Rust verifier:
#       reads the same contract artifact for conformance
#
# Principle:
#   This file is a versioned contract artifact, not helper config.
#   Consumers may ignore it, but divergence becomes detectable.
# ============================================================


# ------------------------------------------------------------
# Schema identity
# ------------------------------------------------------------

[schema]
schema_id = "se-role-capability-map-1"
version = "0.1.0"
status = "draft"
title = "Structural Explainability Role Capability Map"
description = "Maps manifest classes to role groups, capability profiles, and semantic graph permissions."


# ------------------------------------------------------------
# Export metadata
# ------------------------------------------------------------

[export]
path = "data/schema/role-capability-map.toml"
schema_path = "data/schema/role-capability-map.schema.toml"


# ------------------------------------------------------------
# Consumers
# ------------------------------------------------------------

[consumers]
graph_verifier = "se-manifest verify-graph"
stage_verifier = "accountable-record"
future_rust_verifier = "accountable-record-rs"


# ------------------------------------------------------------
# Role groups
# ------------------------------------------------------------
# Keys are manifest repo classes from manifest-schema.toml.
# Values are normalized role groups used by graph rules and capability profiles.
#
# Keep class names aligned with the class registry in manifest-schema.toml.
# Keep role group names stable once graph rules depend on them.
# ------------------------------------------------------------

[role_groups]
adapter = "adapter"
admin = "administration"
constitution = "constitution"
contract = "contract"
data_companion = "data"
docs = "documentation"
engine = "tooling"
formal_contract = "formal_contract"
govsrc = "govsrc"
implementation = "implementation"
kernel = "kernel"
manifest_schema = "manifest_schema"
mapping = "mapping"
mapspec = "mapspec"
pilot = "pilot"
policy = "policy"
profile = "profile"
record_system = "record_system"
regimes = "regimes"
rules = "rules"
schema = "schema"
spec = "specification"
theory = "theory"
verification = "verification"
verifier = "verifier"


# ------------------------------------------------------------
# Capability profiles
# ------------------------------------------------------------
# These are read by stage/verifier implementations.
#
# The names are intentionally capability-oriented rather than implementation-
# oriented. The AR verifier can derive s040/s070 gates from these values without
# redefining class/role semantics locally.
# ------------------------------------------------------------

