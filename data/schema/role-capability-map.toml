# ------------------------------------------------------------
# Graph permissions
# ------------------------------------------------------------
# These are read by se-manifest verify-graph.
#
# Authority rules apply only to dependencies with kind = "semantic".
# Tooling dependencies are real dependencies for installation and CI, but they
# do not confer semantic authority.
# ------------------------------------------------------------

[graph_permissions]
semantic_edge_kinds = ["semantic"]
resolution_checked_edge_kinds = [
    "semantic",
    "tooling",
    "documentation",
    "test",
    "release",
    "provenance",
]

entry_point_role_groups = [
    "administration",
    "application",
    "documentation",
    "govsrc",
    "paper",
    "pilot",
]


# ------------------------------------------------------------
# Graph invariant SG01: no domain semantics in the core
# ------------------------------------------------------------

[graph_permissions.no_core_depends_on_domain]
source_role_groups = [
    "constitution",
    "kernel",
    "manifest_schema",
    "substrate",
    "boundary",
]
forbidden_target_role_groups = [
    "domain",
    "application",
    "example",
    "govsrc",
    "record_system",
]
diagnostic = "SE.ORG.CORE_DEPENDS_ON_DOMAIN"


# ------------------------------------------------------------
# Graph invariant SG02: interpretation stays external
# ------------------------------------------------------------

[graph_permissions.no_interpretation_leak]
source_role_groups = [
    "substrate",
    "boundary",
    "kernel",
]
forbidden_target_role_groups = [
    "mapping",
    "govsrc",
]
diagnostic = "SE.ORG.INTERPRETATION_LEAK"


# ------------------------------------------------------------
# Graph invariant SG03: implementations are not semantic authority
# ------------------------------------------------------------

[graph_permissions.no_contract_depends_on_implementation]
source_role_groups = [
    "contract",
    "formal_contract",
    "record_system",
    "schema",
]
forbidden_target_role_groups = [
    "implementation",
    "verification",
    "verifier",
]
diagnostic = "SE.ORG.CONTRACT_DEPENDS_ON_IMPL"


# ------------------------------------------------------------
# Graph invariant SG04: operational systems do not consume theory directly
# ------------------------------------------------------------

[graph_permissions.no_theory_bypass]
source_role_groups = [
    "application",
    "implementation",
    "record_system",
    "verifier",
]
forbidden_target_role_groups = [
    "theory",
]
allowed_intermediate_role_groups = [
    "formal_contract",
]
diagnostic = "SE.ORG.THEORY_BYPASS"


# ------------------------------------------------------------
# Graph invariant SG05: layer monotonicity
# ------------------------------------------------------------
# Lower numbers are more foundational.
# A semantic dependency edge should point from a higher or equal number to a
# lower or equal number. Edges pointing toward larger numbers are inversions.
# ------------------------------------------------------------

[layer_order]
manifest_schema = 0
constitution = 1
kernel = 2
theory = 3
formal_contract = 4
contract = 5
schema = 6
mapspec = 6
policy = 6
rules = 7
profile = 7
mapping = 8
regimes = 8
adapter = 9
data = 9
tooling = 9
implementation = 10
verification = 10
verifier = 10
record_system = 11
govsrc = 12
documentation = 12
administration = 13
pilot = 13
specification = 13

[graph_permissions.layer_monotonicity]
diagnostic = "SE.ORG.LAYER_INVERSION"
uses_layer_order = true


# ------------------------------------------------------------
# Theory surface taxonomy
# ------------------------------------------------------------
# These buckets are semantic roles, not Lean syntax categories.
# Each theory surface mirror must expose all buckets, even when empty.
# ------------------------------------------------------------

[surface_buckets]
required = [
    "types",
    "predicates",
    "axioms",
    "theorems",
    "witnesses",
]

constant_names = [
    "SURFACE_TYPES",
    "SURFACE_PREDICATES",
    "SURFACE_AXIOMS",
    "SURFACE_THEOREMS",
    "SURFACE_WITNESSES",
]
